<script src="js/script.js"></script>
<script>
  (function () {
    var lightbox = document.getElementById('lightbox');
    var lightboxImg = document.getElementById('lightboxImg');
    var closeBtn = document.getElementById('lightboxClose');
    var prevBtn = document.getElementById('lightboxPrev');
    var nextBtn = document.getElementById('lightboxNext');
    var galleryImgs = Array.prototype.slice.call(document.querySelectorAll('.comic-col img'));
    var currentIndex = 0;

    function showImage(index) {
      currentIndex = (index + galleryImgs.length) % galleryImgs.length;
      var img = galleryImgs[currentIndex];
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
    }

    galleryImgs.forEach(function (img, index) {
      img.addEventListener('click', function () {
        showImage(index);
        lightbox.classList.add('open');
      });
    });

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }

    function showPrev() {
      showImage(currentIndex - 1);
    }

    function showNext() {
      showImage(currentIndex + 1);
    }

    closeBtn.addEventListener('click', closeLightbox);
    prevBtn.addEventListener('click', showPrev);
    nextBtn.addEventListener('click', showNext);

    lightbox.addEventListener('click', function (e) {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', function (e) {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showPrev();
      if (e.key === 'ArrowRight') showNext();
    });
  })();
</script>
<script>
  (function () {
    var videoLightbox = document.getElementById('videoLightbox');
    var videoLightboxInner = document.getElementById('videoLightboxInner');
    var closeBtn = document.getElementById('videoLightboxClose');
    var videos = Array.prototype.slice.call(document.querySelectorAll('.video-grid video'));

    videos.forEach(function (video) {
      video._originalParent = video.parentNode;
      video._originalNextSibling = video.nextSibling;

      video.addEventListener('play', function () {
        if (video.parentNode === videoLightboxInner) return;
        videoLightboxInner.appendChild(video);
        videoLightbox.classList.add('open');
        video.play();
      });
    });

    function closeVideoLightbox() {
      var video = videoLightboxInner.querySelector('video');
      if (video) {
        video.pause();
        if (video._originalNextSibling) {
          video._originalParent.insertBefore(video, video._originalNextSibling);
        } else {
          video._originalParent.appendChild(video);
        }
      }
      videoLightbox.classList.remove('open');
    }

    closeBtn.addEventListener('click', closeVideoLightbox);

    videoLightbox.addEventListener('click', function (e) {
      if (e.target === videoLightbox) closeVideoLightbox();
    });

    document.addEventListener('keydown', function (e) {
      if (!videoLightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeVideoLightbox();
    });
  })();
</script>
